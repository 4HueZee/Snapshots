name: Auto-Discover and Publish Snapshots

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proxy Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Discover and Process Repositories
        run: |
          # 1. FETCH THE MASTER GALLERY INDEX
          GALLERY_URL="https://github.com/BSData/gallery/releases/latest/download/bsdata.catpkg-gallery.json"
          curl -L $GALLERY_URL -o gallery.json

          # 2. DEFINE YOUR KEYWORDS (Case-insensitive)
          KEYWORDS="wh40k horus sigmar kill-team"

          mkdir -p output
          
          # 3. EXTRACT ID AND URL USING JQ
          # We use -c to get one JSON object per line for easier looping
          REPOS=$(cat gallery.json | jq -c '.repositories[]')

          while read -r REPO_OBJ; do
            ID=$(echo $REPO_OBJ | jq -r '.name')
            # Extract the base GitHub URL from the download link
            # Transforms: .../BSData/repo/releases/... -> https://github.com/BSData/repo
            URL=$(echo $REPO_OBJ | jq -r '.repositoryUrl' | sed 's/\/releases\/latest\/download\/.*//')

            # Filter Logic
            MATCH=false
            for KW in $KEYWORDS; do
              if [[ "${ID,,}" == *"$KW"* ]]; then MATCH=true; fi
            done

            if [ "$MATCH" = true ]; then
              echo "::group::Processing $ID"
              echo "Source: $URL"
              
              # Clone and Shape
              git clone --depth 1 $URL temp_rules
              python shaper.py --source temp_rules --output output/$ID.db --id $ID
              
              rm -rf temp_rules
              echo "::endgroup::"
            fi
          done <<< "$REPOS"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
