name: Auto-Discover and Publish Snapshots

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proxy Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Discover and Process Repositories
        run: |
          # 1. FETCH THE MASTER GALLERY INDEX
          GALLERY_URL="https://github.com/BSData/gallery/releases/latest/download/bsdata.catpkg-gallery.json"
          curl -L $GALLERY_URL -o gallery.json

          # 2. DEFINE YOUR KEYWORDS (Case-insensitive)
          KEYWORDS="40k heresy sigmar kill-team"

          mkdir -p output
          
          # 3. EXTRACT LOCATIONS AND LOOP
          REPOS=$(cat gallery.json | jq -r '.repositories[].location')

          for REPO_URL in $REPOS; do
            # Filter Logic
            MATCH=false
            for KW in $KEYWORDS; do
              if [[ "${REPO_URL,,}" == *"$KW"* ]]; then MATCH=true; fi
            done

            if [ "$MATCH" = true ]; then
              # Extract clean ID (e.g., 'wh40k-10th' from the URL)
              REPO_ID=$(basename $REPO_URL)
              echo "::group::Processing $REPO_ID"
              
              # Clone using the full URL from the gallery
              git clone --depth 1 $REPO_URL temp_rules
              
              # Run the Shaper
              python shaper.py --source temp_rules --output output/$REPO_ID.db --id $REPO_ID
              
              rm -rf temp_rules
              echo "::endgroup::"
            fi
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
