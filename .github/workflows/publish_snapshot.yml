name: Auto-Discover and Publish Snapshots

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Proxy Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Discover and Process Repositories
        run: |
          GALLERY_URL="https://github.com/BSData/gallery/releases/latest/download/bsdata.catpkg-gallery.json"
          curl -L $GALLERY_URL -o gallery.json

          KEYWORDS="40k heresy sigmar kill-team"

          mkdir -p output
          
          REPOS=$(cat gallery.json | jq -r '.repositories[].location')

          for REPO_PATH in $REPOS; do
            MATCH=false
            for KW in $KEYWORDS; do
              if [[ "${REPO_PATH,,}" == *"$KW"* ]]; then MATCH=true; fi
            done

            if [ "$MATCH" = true ]; then
              REPO_NAME=$(echo $REPO_PATH | cut -d'/' -f2)
              echo "::group::Processing $REPO_PATH"
              
              git clone --depth 1 https://github.com/$REPO_PATH.git temp_rules
              python shaper.py --source temp_rules --output output/$REPO_NAME.db --id $REPO_NAME
              
              rm -rf temp_rules
              echo "::endgroup::"
            fi
          done

          python -c "import os, json, glob; files = glob.glob('output/*.db'); manifest = [{'repo': os.path.basename(f).replace('.db', ''), 'file': os.path.basename(f), 'size': os.path.getsize(f)} for f in files]; f = open('output/manifest.json', 'w'); json.dump({'snapshots': manifest}, f, indent=2); f.close()"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
